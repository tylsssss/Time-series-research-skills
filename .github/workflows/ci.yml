name: ci

# The steps here are not restated inline: the job calls `make ci`, and `make ci` is
# runnable locally before pushing. A workflow that duplicates its checks drifts
# from them — this repository already shipped one stale probe-profile name in a
# step that only CI ever executed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: make ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # lint -> self-test -> bundle -> installer (throwaway HOME) -> profile swap
      # round-trip -> identity rename no-op
      - name: make ci
        run: make ci

      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            dist/*.bundle.md
            dist/manifest.json
          if-no-files-found: error
